      <div class="space-stream">
        <!--
          用法（复制一块往下贴就行）：
          <section class="space-block is-note|is-blog|is-tool|is-photo|is-drawing">
            <div class="space-meta">
              <span class="space-pill">标签</span>
              <span class="space-date">2026-03-17</span>
            </div>
            <h2>标题</h2>
            <p>内容...</p>
          </section>
        -->

        <section class="space-block is-note">
          <div class="space-meta">
            <span class="space-pill">NOTE</span>
            <span class="space-date">Pinned</span>
          </div>
          <h2>怎么往这里加内容？</h2>
          <p>
            你想到什么就复制下面任意一个块（Blog/Tool/Photo/Drawing/Note），改标题和内容，然后粘贴到页面最上面。
            这个页面会一直保持“随手记录”的感觉，但每块内容都能用样式区分。
          </p>
        </section>
